<!DOCTYPE html>
<html lang="cs" data-title-cs="404 - Nenalezeno" data-title-en="404 - Not Found">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nenalezeno</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23161d29'/><text x='50' y='68' font-family='sans-serif' font-size='52' font-weight='bold' fill='%23e4f0ff' text-anchor='middle'>RL</text></svg>">
    <script>
        (function() {
            const saved = localStorage.getItem('preferredLang');
            const browserEn = !saved && navigator.language && !navigator.language.startsWith('cs') && !navigator.language.startsWith('sk');
            if (saved === 'en' || browserEn) {
                const html = document.documentElement;
                html.classList.add('lang-en-active');
                html.setAttribute('lang', 'en');
                document.title = html.dataset.titleEn;
            }
        })();
    </script>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn" id="langToggleBtn" aria-label="Přepnout jazyk / Switch language">EN</button>
    </div>

    <main class="error-container">
        <h1>404</h1>

        <h2>
            <span class="lang-cs">Tady nic není.</span>
            <span class="lang-en">Nothing here.</span>
        </h2>

        <p>
            <span class="lang-cs">Stránka, kterou hledáte, neexistuje, nebo byla přesunuta.</span>
            <span class="lang-en">The page you are looking for doesn't exist or has been moved.</span>
        </p>

        <a href="/" class="btn btn-primary">
            <span class="lang-cs">Zpět na domovskou stránku</span>
            <span class="lang-en">Back to homepage</span>
        </a>
    </main>
</body>
</html>
