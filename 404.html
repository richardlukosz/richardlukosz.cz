<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nenalezeno / Not Found</title>
    <style>
        :root {
            --bg-main: #7e8ca5;
            --bg-island: #e4f0ff;
            --bg-secondary: #a5b7d9;
            --text-dark: #161d29;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg-main); 
            color: var(--text-dark); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
            position: relative;
            padding: 80px 20px 40px 20px; 
        }

        body:not(.lang-en-active) .lang-en { display: none; }
        body.lang-en-active .lang-cs { display: none; }

        .error-container {
            max-width: 760px;
            width: 100%;
            background: var(--bg-island);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 { 
            font-size: 5.5rem; 
            margin: 0; 
            line-height: 1;
            color: var(--text-dark);
            opacity: 0.75;
            letter-spacing: 4px;
            font-family: monospace;
        }

        h2 {
            font-size: 2rem;
            margin: 8px 0 0 0;
            color: var(--text-dark);
        }

        p {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 1.15rem;
            margin: 10px 0 30px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--bg-island);
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
        }

        .lang-switcher {
            position: fixed;
            top: 20px; 
            right: 20px; 
            z-index: 100;
        }

        .lang-btn {
            background: var(--bg-island);
            color: var(--text-dark); 
            border: 2px solid var(--text-dark);
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            transition: 0.2s;
        }

        .hamburger-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--bg-island);
            border: 2px solid var(--text-dark);
            border-radius: 8px;
            padding: 2px 10px;
            color: var(--text-dark);
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            z-index: 100;
            transition: 0.2s;
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            left: -100%;
            width: 250px;
            height: 100vh;
            background: var(--bg-island);
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            padding: 85px 25px;
            transition: 0.3s ease;
            z-index: 99;
        }

        .mobile-menu.open { left: 0; }

        .menu-link {
            color: var(--bg-main);
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        @media (hover: hover) {
            .lang-btn:hover, .hamburger-btn:hover { 
                background: var(--bg-secondary); 
            }
            .menu-link:hover { 
                color: var(--text-dark); 
            }
            .btn-primary:hover {
                background: var(--bg-secondary);
            }
        }

        @media (max-width: 600px) {
            body { padding: 75px 15px 30px 15px; }
            .error-container { padding: 36px 20px; border-radius: 18px; }
            h1 { font-size: 4rem; }
            h2 { font-size: 1.5rem; }
            p { font-size: 1.05rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <button class="hamburger-btn" aria-label="Menu" id="menuToggleBtn">☰</button>
    <nav class="mobile-menu" id="mobileMenu">
        <a href="index.html" class="menu-link">Domů / Home</a>
        <a href="projects.html" class="menu-link">Projekty / Projects</a>
    </nav>

    <div class="lang-switcher">
        <button class="lang-btn" id="langToggleBtn">EN</button>
    </div>

    <main class="error-container">
        <h1>404</h1>
        
        <h2>
            <span class="lang-cs">Tady nic není.</span>
            <span class="lang-en">Nothing here.</span>
        </h2>
        
        <p>
            <span class="lang-cs">Stránka, kterou hledáte, neexistuje, nebo byla přesunuta.</span>
            <span class="lang-en">The page you are looking for doesn't exist or has been moved.</span>
        </p>

        <a href="index.html" class="btn btn-primary">
            <span class="lang-cs">Zpět na domovskou stránku</span>
            <span class="lang-en">Back to homepage</span>
        </a>
    </main>

    <script>
        function setLanguage(lang) {
            const body = document.body;
            const htmlTag = document.documentElement;
            const langBtn = document.getElementById('langToggleBtn');

            if (lang === 'en') {
                body.classList.add('lang-en-active');
                htmlTag.setAttribute('lang', 'en');
                if (langBtn) langBtn.innerText = 'CZ';
            } else {
                body.classList.remove('lang-en-active');
                htmlTag.setAttribute('lang', 'cs');
                if (langBtn) langBtn.innerText = 'EN';
            }

            localStorage.setItem('preferredLang', lang);
        }

        const savedLang = localStorage.getItem('preferredLang') || 'cs';
        setLanguage(savedLang);

        document.getElementById('langToggleBtn').addEventListener('click', function() {
            const currentLang = document.documentElement.getAttribute('lang');
            const newLang = currentLang === 'cs' ? 'en' : 'cs';
            setLanguage(newLang);
        });

        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const menu = document.getElementById('mobileMenu');

        menuToggleBtn.addEventListener('click', function() {
            menu.classList.toggle('open');
        });

        document.addEventListener('click', function(event) {
            if (menu.classList.contains('open')) {
                if (!menu.contains(event.target) && !menuToggleBtn.contains(event.target)) {
                    menu.classList.remove('open');
                }
            }
        });
    </script>
</body>
</html>
